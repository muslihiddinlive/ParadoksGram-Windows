name: ParadoksGram Windows.

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Ignore the incremental build cache and compile everything'
        type: boolean
        default: false
  # Cache-only run: GitHub deletes caches that were not used for 7 days, and a cold Libraries step
  # (Qt, ffmpeg, ...) takes over an hour. Restoring the caches every 4 days keeps them alive.
  schedule:
    - cron: '17 3 */4 * *'
  push:
    branches:
      - dev
    paths:
      - 'Telegram/**'
      - '.github/workflows/paradoks-win.yml'

permissions:
  contents: write
  actions: write   # to prune older build directory caches

# A running build is never cancelled by a newer push (a build is long and used to be thrown away
# again and again). While one runs, GitHub keeps only the newest waiting run, so pushes made
# during a build are merged into one following build.
concurrency:
  group: paradoks-win
  cancel-in-progress: false

jobs:

  # Pushes often come in bursts. Wait a few minutes and only build the commit that is still the
  # tip of the branch, so a burst costs one build instead of several.
  settle:
    name: Wait for more pushes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - name: Wait.
        run: sleep 240
      - name: Is this still the newest commit?
        id: check
        run: |
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer commit (${tip:0:7}) exists, this one is skipped."
          fi

  windows:
    name: Windows x64
    needs: settle
    if: ${{ !cancelled() && (needs.settle.result == 'skipped' || needs.settle.outputs.current == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 350

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      # The runner commits only ~19 GB, which the compiler exhausts (C1060).
      - name: Bigger pagefile on D.
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 48GB
          maximum-size: 48GB
          disk-root: "D:"

      - name: Prepare directories.
        run: |
          mkdir D:\TBuild\Libraries
          mklink /d %userprofile%\TBuild D:\TBuild
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v4-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-libs-v4-
            ${{ runner.OS }}-x64-libs-v3-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-v2-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-qt-v2-
            ${{ runner.OS }}-x64-qt-

      - name: Cache-only run?
        id: gate
        shell: bash
        run: |
          # A scheduled run only has to touch the caches (that resets their 7-day expiry).
          # If any of them is missing, fall through and rebuild/save them as usual.
          if [ "${{ github.event_name }}" = "schedule" ] \
            && [ "${{ steps.cache-third-party.outputs.cache-hit }}" = "true" ] \
            && [ "${{ steps.cache-libs.outputs.cache-hit }}" = "true" ] \
            && [ "${{ steps.cache-qt.outputs.cache-hit }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "All caches are warm, nothing to build."
          fi

      - name: Libraries.
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 300
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent > %GITHUB_WORKSPACE%\libraries.log 2>&1
          set RESULT=%ERRORLEVEL%
          type %GITHUB_WORKSPACE%\libraries.log
          exit /b %RESULT%

      - name: Free up some disk space.
        if: always() && steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          if [ -d "$LibrariesPath" ]; then
            find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tdesktop_rust/out/*' ')' -type f ')' -o -empty ')' -delete
          fi

      - name: Save ThirdParty cache.
        if: always() && steps.cache-third-party.outputs.cache-hit != 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache.
        if: always() && steps.cache-libs.outputs.cache-hit != 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v4-${{ env.CACHE_KEY }}

      - name: Save Qt cache.
        if: always() && steps.cache-qt.outputs.cache-hit != 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-v2-${{ env.CACHE_KEY }}

      - name: Choose API credentials.
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV
          else
            echo "No API secrets, using the test credentials."
            echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_TEST=ON" >> $GITHUB_ENV
          fi

      - name: Ads server address.
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          ADS_SERVER_URL: ${{ vars.ADS_SERVER_URL || secrets.ADS_SERVER_URL }}
        run: |
          FILE="$TBUILD/$REPO_NAME/Telegram/SourceFiles/paradoks/paradoks_ads_server.h"
          URL="$(printf '%s' "$ADS_SERVER_URL" | tr -d '\r\n"\\ ')"
          if [ -n "$URL" ]; then
            printf '#pragma once\n#define PARADOKS_AD_SERVER "%s"\n' "$URL" > "$FILE"
            echo "Own ads server address is set."
          else
            echo "ADS_SERVER_URL is empty, own ads stay off."
          fi

      # Incremental builds: restore the previous build directory (objects, precompiled header,
      # generated code). Only sources that changed since then get recompiled. Disable with
      # "[clean]" in the commit message or the clean_build input of a manual run.
      - name: Build directory cache.
        id: cache-out
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.clean_build != 'true' && !contains(github.event.head_commit.message, '[clean]')
        uses: actions/cache/restore@v6
        with:
          path: D:\out
          key: ${{ runner.OS }}-x64-out-v1-${{ env.CACHE_KEY }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.OS }}-x64-out-v1-${{ env.CACHE_KEY }}-

      - name: Incremental build preparation.
        if: steps.cache-out.outputs.cache-matched-key != ''
        shell: bash
        continue-on-error: true
        run: |
          SRC="$(cygpath -u "$TBUILD/$REPO_NAME")"
          bash "$SRC/.github/scripts/paradoks-incremental.sh" prepare "$SRC" /d/out || {
            echo "::warning::Preparation failed, doing a clean build instead."
            rm -rf /d/out/* /d/out/.paradoks_src_manifest
          }

      - name: Build output on D drive.
        if: steps.gate.outputs.skip != 'true'
        run: |
          if not exist D:\out mkdir D:\out
          mklink /d %TBUILD%\%REPO_NAME%\out D:\out

      - name: ParadoksGram configure.
        if: steps.gate.outputs.skip != 'true'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat x64 ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D PARADOKS_BUILD_NUMBER=%GITHUB_RUN_NUMBER% ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON > %GITHUB_WORKSPACE%\configure.log 2>&1
          set RESULT=%ERRORLEVEL%
          type %GITHUB_WORKSPACE%\configure.log
          exit /b %RESULT%

      - name: Disk watchdog.
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $script = @'
          while ($true) {
            $line = (Get-Date -Format s)
            foreach ($d in 'C','D') {
              $free = [math]::Round((Get-PSDrive $d).Free / 1GB, 1)
              $line += " $d=${free}G"
              if ($free -lt 3) {
                "$line LOW DISK, stopping build" | Add-Content "$env:GITHUB_WORKSPACE\disk.log"
                taskkill /F /T /IM cmake.exe | Out-Null
                exit
              }
            }
            $line | Add-Content "$env:GITHUB_WORKSPACE\disk.log"
            Start-Sleep -Seconds 120
          }
          '@
          Set-Content "$env:GITHUB_WORKSPACE\watch.ps1" $script
          Start-Process pwsh -WindowStyle Hidden -ArgumentList '-NoProfile','-File',"$env:GITHUB_WORKSPACE\watch.ps1"

      - name: ParadoksGram build.
        id: build
        if: steps.gate.outputs.skip != 'true'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          cmake --build ..\out --config Release --parallel 1 -- /p:CL_MPCount=4 > %GITHUB_WORKSPACE%\build.log 2>&1
          set RESULT=%ERRORLEVEL%
          type %GITHUB_WORKSPACE%\build.log
          exit /b %RESULT%

      - name: Report errors.
        if: failure() && steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set +e +o pipefail
          enc() { sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}'; }
          for name in libraries configure build; do
            f="$GITHUB_WORKSPACE/$name.log"
            [ -f "$f" ] || continue
            errs=$(grep -aE 'error C[0-9]+|error LNK|fatal error|: error |CMake Error|FAILED' "$f" | sort -u | head -n 40 | enc)
            tail=$(tail -n 30 "$f" | enc)
            echo "::error title=$name.log errors::$errs"
            echo "::error title=$name.log tail::$tail"
          done
          if [ -f "$GITHUB_WORKSPACE/disk.log" ]; then
            echo "::notice title=disk.log::$(tail -n 8 "$GITHUB_WORKSPACE/disk.log" | enc)"
          fi
          exit 0

      # Save the build directory also after a failed build: the objects that did compile are
      # valid, so the next attempt only has to build what is missing.
      - name: Record the sources of this build directory.
        id: out-manifest
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        shell: bash
        continue-on-error: true
        run: |
          SRC="$(cygpath -u "$TBUILD/$REPO_NAME")"
          bash "$SRC/.github/scripts/paradoks-incremental.sh" save "$SRC" /d/out

      - name: Save build directory cache.
        if: always() && steps.out-manifest.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: D:\out
          key: ${{ runner.OS }}-x64-out-v1-${{ env.CACHE_KEY }}-${{ github.sha }}

      - name: Prune older build directory caches.
        if: always() && steps.out-manifest.outcome == 'success'
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "${RUNNER_OS}-x64-out-v1-" --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id')
          for id in $ids; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done

      - name: Sign Telegram.exe (only when a certificate secret is set).
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [ -z "$WIN_CERT_PFX" ]; then
            echo "No WIN_CERT_PFX secret: the exe stays unsigned (publisher shows as Unknown)."
            exit 0
          fi
          signtool=$(ls /c/Program\ Files\ \(x86\)/Windows\ Kits/10/bin/*/x64/signtool.exe | sort | tail -n 1)
          echo "$WIN_CERT_PFX" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          exe=$(find /d/out -maxdepth 3 -name Telegram.exe | head -n 1)
          "$signtool" sign //f "$(cygpath -w "$RUNNER_TEMP/cert.pfx")" //p "$WIN_CERT_PASSWORD" //fd sha256 //tr http://timestamp.digicert.com //td sha256 "$(cygpath -w "$exe")"
          rm -f "$RUNNER_TEMP/cert.pfx"

      - name: Package.
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir artifact
          exe=$(find /d/out -maxdepth 3 -name Telegram.exe | head -n 1)
          echo "Using $exe"
          cp "$exe" artifact/
          cd artifact
          map=$(find /d/out -maxdepth 4 -name "Telegram.map" | head -n 1)
          7z a -tzip -mx=9 -mfb=258 ../ParadoksGram-Windows-x64.zip Telegram.exe &
          7z a -t7z -m0=lzma2 -mx=9 -md=64m -mfb=64 -ms=on -mmt=2 ../ParadoksGram-Windows-x64.7z Telegram.exe &
          if [ -n "$map" ]; then
            7z a -t7z -m0=lzma2 -mx=5 -md=64m -mmt=1 ../ParadoksGram-Symbols.7z "$map" &
          else
            echo "No Telegram.map found under /d/out"
          fi
          wait
          ls -l ../ParadoksGram-Windows-x64.* ../ParadoksGram-Symbols.7z

      - name: Installer.
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $repo = Join-Path $env:TBUILD $env:REPO_NAME
          & $iscc `
            "/DBuild=${{ github.run_number }}" `
            "/DSourceExe=$env:GITHUB_WORKSPACE\artifact\Telegram.exe" `
            "/DIconFile=$repo\Telegram\Resources\art\icon256.ico" `
            "/DOutDir=$env:GITHUB_WORKSPACE" `
            "$repo\.github\installer\paradoksgram.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Sign installer (only when a certificate secret is set).
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [ -z "$WIN_CERT_PFX" ] || [ ! -f ParadoksGram-Setup.exe ]; then
            exit 0
          fi
          signtool=$(ls /c/Program\ Files\ \(x86\)/Windows\ Kits/10/bin/*/x64/signtool.exe | sort | tail -n 1)
          echo "$WIN_CERT_PFX" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          "$signtool" sign //f "$(cygpath -w "$RUNNER_TEMP/cert.pfx")" //p "$WIN_CERT_PASSWORD" //fd sha256 //tr http://timestamp.digicert.com //td sha256 ParadoksGram-Setup.exe
          rm -f "$RUNNER_TEMP/cert.pfx"

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: steps.gate.outputs.skip != 'true'
        with:
          name: ParadoksGram-Windows-x64
          path: ParadoksGram-Windows-x64.zip
          retention-days: 30

      - name: Publish release.
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(ParadoksGram-Windows-x64.zip)
          if [ -f ParadoksGram-Windows-x64.7z ]; then files+=(ParadoksGram-Windows-x64.7z); fi
          if [ -f ParadoksGram-Setup.exe ]; then files+=(ParadoksGram-Setup.exe); fi
          SRC="$TBUILD/$REPO_NAME"
          SYMS=""
          if [ -f ParadoksGram-Symbols.7z ]; then SYMS=ParadoksGram-Symbols.7z; fi
          VER=$(tr -d '[:space:]' < "$SRC/VERSION")
          if [ -f "$SRC/changelog/$VER.md" ]; then cp "$SRC/changelog/$VER.md" release-notes.md; else printf "Kichik yaxshilanishlar va xatolar tuzatildi." > release-notes.md; fi
          gh release create "build-${{ github.run_number }}" "${files[@]}" $SYMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "ParadoksGram Windows $VER (build ${{ github.run_number }})" \
            --notes-file release-notes.md \
            --prerelease

          # Fixed tag: always points at the newest build, so one URL never changes.
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "ParadoksGram Windows (latest)" \
              --notes "Newest build" --prerelease
          gh release upload latest "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit latest --repo "$GITHUB_REPOSITORY" \
            --notes "Build ${{ github.run_number }}, commit ${GITHUB_SHA::7}"

      - name: Notify Telegram.
        if: always() && steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "No Telegram secrets, skipping."
            exit 0
          fi
          api="https://api.telegram.org/bot$BOT_TOKEN"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          zip=ParadoksGram-Windows-x64.zip

          if [ "$JOB_STATUS" != "success" ]; then
            text=$(printf 'ParadoksGram Windows #%s: %s\nCommit %s\n%s' "$GITHUB_RUN_NUMBER" "$JOB_STATUS" "${GITHUB_SHA::7}" "$run_url")
            curl -sS -o /dev/null "$api/sendMessage" -d chat_id="$CHAT_ID" --data-urlencode text="$text" || true
            exit 0
          fi

          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/build-$GITHUB_RUN_NUMBER"
          caption=$(printf 'ParadoksGram Windows #%s: success\nCommit %s\n%s' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$release_url")
          size=$(stat -c %s "$zip" 2>/dev/null || echo 0)
          # Bot API uploads are capped at 50 MB, so bigger builds go as a link.
          if [ "$size" -gt 0 ] && [ "$size" -lt 52000000 ]; then
            curl -sS -o /dev/null "$api/sendDocument" -F chat_id="$CHAT_ID" -F document=@"$zip" -F caption="$caption" || true
          else
            curl -sS -o /dev/null "$api/sendMessage" -d chat_id="$CHAT_ID" --data-urlencode text="$caption" || true
          fi
